# Despliegue gratuito del backend en Render (https://render.com) — "New > Blueprint".
services:
  - type: web
    name: ecopaper-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
